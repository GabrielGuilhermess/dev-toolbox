name: Quality

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Verify exact direct dependencies
        run: |
          node - <<'NODE'
          const packageJson = require('./package.json');
          const groups = ['dependencies', 'devDependencies'];
          const invalid = [];
          for (const group of groups) {
            for (const [name, version] of Object.entries(packageJson[group] ?? {})) {
              if (/^[~^]/.test(version)) invalid.push(`${group}.${name}=${version}`);
            }
          }
          if (invalid.length) {
            console.error(`Direct dependencies must be pinned exactly:\n${invalid.join('\n')}`);
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install visual validation browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Visual validation
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/dev-toolbox-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/dev-toolbox-vite.log
              exit 1
            fi
            sleep 1
          done
          pnpm visual:check

      - name: Upload visual validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-validation-${{ github.sha }}
          path: visual-artifacts
          if-no-files-found: ignore
          retention-days: 7
