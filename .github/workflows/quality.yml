name: Quality

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Verify exact direct dependencies
        run: |
          node - <<'NODE'
          const packageJson = require('./package.json');
          const groups = ['dependencies', 'devDependencies'];
          const invalid = [];
          for (const group of groups) {
            for (const [name, version] of Object.entries(packageJson[group] ?? {})) {
              if (/^[~^]/.test(version)) invalid.push(`${group}.${name}=${version}`);
            }
          }
          if (invalid.length) {
            console.error(`Direct dependencies must be pinned exactly:\n${invalid.join('\n')}`);
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install visual validation runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Visual validation
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/dev-toolbox-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/dev-toolbox-vite.log
              exit 1
            fi
            sleep 1
          done
          node scripts/visual-check.cjs

      - name: Upload visual validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-validation-${{ github.sha }}
          path: visual-artifacts
          if-no-files-found: ignore
          retention-days: 7
