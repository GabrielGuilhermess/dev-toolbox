name: Pnpm lock bootstrap

on:
  push:
    branches:
      - chore/pnpm-runtime-baseline

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install pnpm
        run: npm install --global pnpm@11.25.0

      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only

      - name: Commit pnpm lockfile
        run: |
          if [ -z "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): generate pnpm lockfile"
          git push
